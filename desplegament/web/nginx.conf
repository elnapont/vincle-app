# Punt d'entrada únic: serveix l'aplicació i encamina l'API cap als serveis de
# darrere. Que tot vagi pel mateix origen és el que fa que no hi hagi CORS
# enlloc, ni capçaleres que afegir, ni orígens que mantenir en una llista.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Els noms dels serveis els resol Docker, i ho ha de fer en cada petició: si
  # nginx els resolgués només en arrencar, reiniciar un servei de darrere li
  # deixaria una adreça morta a la mà fins que no es reiniciés ell també. Per
  # obligar-lo a resoldre en cada petició, la destinació ha de portar una
  # variable.
  #
  # Això té una conseqüència que no es veu i que costa de trobar: amb una
  # variable a `proxy_pass`, nginx **deixa d'escurçar la ruta** amb el prefix de
  # la `location` i la passa sencera. Per això cada bloc porta el seu `rewrite`:
  # sense ell, GoTrue rebria `/auth/v1/token` en comptes de `/token`.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # ---------------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------------

  location /auth/v1/ {
    set $servei_auth auth;
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass http://$servei_auth:9999;
    include /etc/nginx/capcaleres-proxy.conf;
  }

  location /rest/v1/ {
    set $servei_rest rest;
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://$servei_rest:3000;
    include /etc/nginx/capcaleres-proxy.conf;
  }

  # Vincle té una funció i el runtime la serveix com a servei principal, així que
  # el nom de la funció es queda aquí i no es passa a l'altra banda.
  location /functions/v1/races {
    set $servei_funcions funcions;
    rewrite ^/functions/v1/races(.*)$ /$1 break;
    proxy_pass http://$servei_funcions:9000;
    include /etc/nginx/capcaleres-proxy.conf;
  }

  # ---------------------------------------------------------------------------
  # Aplicació
  # ---------------------------------------------------------------------------

  # L'export d'Expo genera un HTML per ruta, no una sola pàgina. Es busca primer
  # el fitxer, després el `.html` germà i finalment l'índex del directori; només
  # si no hi ha res es cau a l'arrel, que és qui sap dibuixar un 404 del producte.
  location / {
    try_files $uri $uri.html $uri/index.html /index.html;
  }

  # Els fitxers amb empremta al nom no canvien mai de contingut: es poden guardar
  # per sempre. L'HTML, en canvi, no s'ha de guardar, o un desplegament nou
  # continuaria servint el mapa d'actius vell.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control 'public, immutable';
  }

  location = /index.html {
    expires -1;
    add_header Cache-Control 'no-store';
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
