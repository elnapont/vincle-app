# Capçaleres comunes a totes les rutes de proxy.
#
# `Authorization` i `apikey` no s'hi esmenten a posta: nginx passa les capçaleres
# de la petició tal com arriben, i són les que porten la sessió. Tocar-les seria
# la manera de trencar-ho.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection '';
